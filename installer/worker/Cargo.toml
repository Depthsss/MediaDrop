[package]
name = "mediadrop-installer-worker"
version = "1.0.1"
edition = "2021"
publish = false

[lib]
name = "mediadrop_installer_worker"
path = "src/lib.rs"

[[bin]]
name = "mediadrop-installer-worker"
path = "src/main.rs"

[features]
default = ["installer-mode"]
installer-mode = []
component-mode = []
test-engine = ["installer-mode", "component-mode"]

[dependencies]
mediadrop-component-update = { path = "../../component-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"

[build-dependencies]
embed-resource = "3.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
