title = "MediaDrop secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies and release outputs"
paths = [
  '''(?:^|[\\/])(?:node_modules|target|dist|\.cache|artifacts|\.venv|build)(?:[\\/]|$)''',
  '''(?:^|[\\/])src-tauri[\\/]binaries[\\/].*\.exe$'''
]

[[allowlists]]
description = "Stable Chromium extension public key (not a credential)"
condition = "AND"
paths = ['''(?:^|[\\/])browser-extension[\\/]manifest\.json$''']
stopwords = ['''''']
